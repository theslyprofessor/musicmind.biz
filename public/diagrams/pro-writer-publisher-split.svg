<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Animated diagram of Performing Rights Organizations (ASCAP and BMI) showing how public performance royalties split into a locked 50% Writer Share and 50% Publisher Share, and how an independent songwriter claims 100% of both shares.">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" rx="8" fill="#18181b"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f4f4f5" font-size="19" font-weight="700">How ASCAP and BMI Split Public Performance Royalties: The 50% Writer / 50% Publisher Rule</text>
  <text x="32" y="60" fill="#a1a1aa" font-size="13">PROs track public performances of the Musical Composition (©) and divide every dollar into two equal halves before paying out.</text>

  <!-- LEFT: PUBLIC PERFORMANCE SOURCES -->
  <rect x="32" y="105" width="300" height="390" rx="6" fill="#09090b" stroke="#f59e0b" stroke-width="2"/>
  <text x="48" y="133" fill="#fbbf24" font-size="15" font-weight="700">Public Performance Sources</text>
  <text x="48" y="152" fill="#a1a1aa" font-size="11.5">Businesses pay blanket license fees to PROs</text>

  <rect x="48" y="170" width="268" height="64" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="60" y="191" fill="#f4f4f5" font-size="12" font-weight="600">1. Streaming Platforms (DSPs)</text>
  <text x="60" y="209" fill="#a1a1aa" font-size="11">Spotify, Apple Music, YouTube, Tidal</text>
  <text x="60" y="224" fill="#fde68a" font-size="10.5">(Public performance share of composition)</text>

  <rect x="48" y="248" width="268" height="64" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="60" y="269" fill="#f4f4f5" font-size="12" font-weight="600">2. Radio &amp; Television Broadcast</text>
  <text x="60" y="287" fill="#a1a1aa" font-size="11">AM/FM Radio, Network/Cable TV, Streaming TV</text>
  <text x="60" y="302" fill="#fde68a" font-size="10.5">(Cue sheets track background sync cues)</text>

  <rect x="48" y="326" width="268" height="64" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="60" y="347" fill="#f4f4f5" font-size="12" font-weight="600">3. Live Concerts, Bars &amp; Venues</text>
  <text x="60" y="365" fill="#a1a1aa" font-size="11">Festivals, clubs, stadiums, and your own gigs</text>
  <text x="60" y="380" fill="#86efac" font-size="10.5">(Submit setlists to ASCAP OnStage / BMI Live!)</text>

  <rect x="48" y="404" width="268" height="72" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="60" y="424" fill="#f4f4f5" font-size="12" font-weight="600">4. International Societies</text>
  <text x="60" y="442" fill="#a1a1aa" font-size="10.5">PRS (UK), GEMA (DE), SACEM (FR), SOCAN (CA)</text>
  <text x="60" y="459" fill="#a1a1aa" font-size="10.5">Routed back to your U.S. PRO via your IPI &amp; ISWC</text>

  <!-- CENTER: THE PRO ENGINE (ASCAP or BMI) -->
  <rect x="425" y="145" width="340" height="310" rx="8" fill="#09090b" stroke="#e4e4e7" stroke-width="2.2"/>
  <text x="595" y="175" text-anchor="middle" fill="#f4f4f5" font-size="16" font-weight="700">Your PRO (Join ONE as a Writer)</text>
  <text x="595" y="195" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">ASCAP  or  BMI  (or SESAC by invite)</text>

  <rect x="445" y="212" width="300" height="82" rx="5" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
  <text x="457" y="232" fill="#e4e4e7" font-size="11" font-weight="700" class="mono">Two Identifiers Minted at Registration:</text>
  <text x="457" y="252" fill="#bae6fd" font-size="10.5" class="mono">• IPI / CAE #: Unique Writer/Publisher ID</text>
  <text x="457" y="270" fill="#fde68a" font-size="10.5" class="mono">• ISWC #: Unique Composition ID (T-...)</text>
  <text x="457" y="286" fill="#a1a1aa" font-size="10">  (Pass this ISWC to The MLC to match mechanicals)</text>

  <rect x="445" y="308" width="300" height="128" rx="5" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="595" y="330" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">Mandatory 50 / 50 Royalty Split</text>
  <text x="457" y="352" fill="#e4e4e7" font-size="10.5">By PRO rule, every collected dollar is split into:</text>
  <text x="457" y="372" fill="#4ade80" font-size="11" font-weight="700">• 50% Writer's Share (100% on BMI 200% scale)</text>
  <text x="457" y="390" fill="#a1a1aa" font-size="10">  Never paid to a publisher; always goes to writer(s)</text>
  <text x="457" y="410" fill="#38bdf8" font-size="11" font-weight="700">• 50% Publisher's Share (100% on BMI scale)</text>
  <text x="457" y="427" fill="#a1a1aa" font-size="10">  Paid to publisher, OR to YOU if self-published!</text>

  <!-- RIGHT TOP: 50% WRITER'S SHARE -->
  <rect x="860" y="105" width="388" height="175" rx="6" fill="#09090b" stroke="#22c55e" stroke-width="2.2"/>
  <text x="878" y="133" fill="#4ade80" font-size="15.5" font-weight="700">50% Writer's Share (Locked to Songwriter)</text>
  <text x="878" y="154" fill="#e4e4e7" font-size="11.5">Paid directly from ASCAP or BMI to the songwriter(s)</text>
  <rect x="878" y="166" width="352" height="98" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="890" y="186" fill="#86efac" font-size="11" font-weight="600">Protected by PRO rules:</text>
  <text x="890" y="204" fill="#a1a1aa" font-size="11">• Even if you sign a publishing deal, your publisher</text>
  <text x="890" y="220" fill="#a1a1aa" font-size="11">  cannot intercept your direct 50% Writer's Share</text>
  <text x="890" y="238" fill="#e4e4e7" font-size="11">• Co-writers divide this 50% according to their</text>
  <text x="890" y="254" fill="#e4e4e7" font-size="11">  signed Split Sheet (e.g., 25% + 25% = 50% total)</text>

  <!-- RIGHT BOTTOM: 50% PUBLISHER'S SHARE -->
  <rect x="860" y="310" width="388" height="185" rx="6" fill="#09090b" stroke="#38bdf8" stroke-width="2.2"/>
  <text x="878" y="338" fill="#38bdf8" font-size="15.5" font-weight="700">50% Publisher's Share (How to Claim It All)</text>
  <text x="878" y="359" fill="#e4e4e7" font-size="11.5">If you have no publisher, YOU are your own publisher</text>
  <rect x="878" y="371" width="352" height="108" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="890" y="391" fill="#bae6fd" font-size="11" font-weight="700">• On BMI (200% Scale):</text>
  <text x="890" y="408" fill="#a1a1aa" font-size="10.5">  When registering a song with no separate publisher, claim</text>
  <text x="890" y="423" fill="#a1a1aa" font-size="10.5">  100% Writer + 100% Publisher (= 200%) on your Writer account.</text>
  <text x="890" y="443" fill="#bae6fd" font-size="11" font-weight="700">• On ASCAP (100% Scale):</text>
  <text x="890" y="460" fill="#a1a1aa" font-size="10.5">  Enable self-publishing on your work registration so ASCAP</text>
  <text x="890" y="474" fill="#a1a1aa" font-size="10.5">  routes both the 50% Writer and 50% Publisher shares to you.</text>

  <!-- Animated Wires -->
  <path d="M 332 300 L 423 300" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arr-amber)"/>
  <circle r="5" fill="#fbbf24"><animateMotion dur="1.2s" repeatCount="indefinite" path="M332,300 L423,300"/></circle>
  <circle r="5" fill="#fbbf24"><animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite" path="M332,300 L423,300"/></circle>

  <path d="M 765 250 L 810 250 L 810 190 L 858 190" fill="none" stroke="#22c55e" stroke-width="2.8" marker-end="url(#arr-green)"/>
  <circle r="4.5" fill="#4ade80"><animateMotion dur="1.3s" repeatCount="indefinite" path="M765,250 L810,250 L810,190 L858,190"/></circle>

  <path d="M 765 360 L 810 360 L 810 400 L 858 400" fill="none" stroke="#38bdf8" stroke-width="2.8" marker-end="url(#arr-blue)"/>
  <circle r="4.5" fill="#38bdf8"><animateMotion dur="1.3s" repeatCount="indefinite" path="M765,360 L810,360 L810,400 L858,400"/></circle>

  <!-- BOTTOM COMPARISON TABLE: ASCAP vs BMI -->
  <rect x="32" y="525" width="1216" height="165" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="48" y="553" fill="#f4f4f5" font-size="14.5" font-weight="700">ASCAP vs. BMI Quick Reference for Independent Songwriters</text>

  <text x="48" y="582" fill="#fbbf24" font-size="12" font-weight="700" class="mono">Feature</text>
  <text x="290" y="582" fill="#38bdf8" font-size="12" font-weight="700" class="mono">ASCAP (ascap.com)</text>
  <text x="760" y="582" fill="#4ade80" font-size="12" font-weight="700" class="mono">BMI (bmi.com)</text>
  <line x1="48" y1="590" x2="1230" y2="590" stroke="#27272a" stroke-width="1.2"/>

  <text x="48" y="612" fill="#e4e4e7" font-size="11.5" font-weight="600">Writer Application Fee</text>
  <text x="290" y="612" fill="#a1a1aa" font-size="11.5">$0 Free for Writer membership (Publisher entity is $50 if separate)</text>
  <text x="760" y="612" fill="#a1a1aa" font-size="11.5">$75 one-time Writer fee ($150 Individual Publisher; $0 via student/org waivers)</text>

  <text x="48" y="636" fill="#e4e4e7" font-size="11.5" font-weight="600">Self-Published 100% Claim</text>
  <text x="290" y="636" fill="#a1a1aa" font-size="11.5">100% Scale: 50% Writer + 50% Publisher claimed on work registration</text>
  <text x="760" y="636" fill="#a1a1aa" font-size="11.5">200% Scale: Writer can claim 100% Writer + 100% Publisher without a pub Co.</text>

  <text x="48" y="660" fill="#e4e4e7" font-size="11.5" font-weight="600">Live Setlist Payouts</text>
  <text x="290" y="660" fill="#a1a1aa" font-size="11.5">ASCAP OnStage (submit your own live concert setlists for royalties)</text>
  <text x="760" y="660" fill="#a1a1aa" font-size="11.5">BMI Live (submit your own live concert setlists for royalties)</text>
</svg>