<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-label="Animated U.S. Copyright Office registration decision tree showing Group of Unpublished Works ($85 for up to 10 works), Group of Works on an Album of Music ($65 for 2 to 20 tracks published on the same date), and Individual Single/Standard applications ($45 or $65 per song when released across different dates or different calendar years).">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker>
  </defs>

  <rect x="0" y="0" width="1280" height="780" rx="8" fill="#18181b"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f4f4f5" font-size="19" font-weight="700">U.S. Copyright Office (eCO) Filing Strategy: Single vs. Group Registration Rules</text>
  <text x="32" y="60" fill="#a1a1aa" font-size="13">How publication status and release dates determine whether you can batch-register up to 10-20 songs or must file per song (37 C.F.R. § 202.4).</text>

  <!-- TOP QUESTION NODE -->
  <rect x="390" y="84" width="500" height="76" rx="8" fill="#09090b" stroke="#e4e4e7" stroke-width="2"/>
  <text x="640" y="114" text-anchor="middle" fill="#f4f4f5" font-size="15" font-weight="700">Have the songs already been released publicly?</text>
  <text x="640" y="138" text-anchor="middle" fill="#a1a1aa" font-size="12">(Distributed to Spotify, Apple Music, YouTube, Bandcamp, or sold/streamed)</text>

  <!-- Branch 1: NO (Unpublished) -> Left -->
  <path d="M 390 122 L 220 122 L 220 220" fill="none" stroke="#22c55e" stroke-width="2.6" marker-end="url(#arr-green)"/>
  <circle r="4.5" fill="#4ade80"><animateMotion dur="1.4s" repeatCount="indefinite" path="M390,122 L220,122 L220,220"/></circle>
  <rect x="242" y="100" width="126" height="22" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
  <text x="305" y="115" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">NO (Unpublished)</text>

  <!-- Branch 2: YES (Published) -> Right -->
  <path d="M 890 122 L 1040 122 L 1040 185" fill="none" stroke="#38bdf8" stroke-width="2.6" marker-end="url(#arr-blue)"/>
  <circle r="4.5" fill="#38bdf8"><animateMotion dur="1.4s" repeatCount="indefinite" path="M890,122 L1040,122 L1040,185"/></circle>
  <rect x="905" y="100" width="120" height="22" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
  <text x="965" y="115" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="700">YES (Published)</text>

  <!-- SECOND QUESTION NODE (Published: Same Album/Date vs Different Dates/Years) -->
  <rect x="550" y="188" width="698" height="68" rx="8" fill="#09090b" stroke="#38bdf8" stroke-width="2"/>
  <text x="899" y="216" text-anchor="middle" fill="#bae6fd" font-size="14.5" font-weight="700">Were all tracks first published on the SAME album on the SAME date (same year)?</text>
  <text x="899" y="238" text-anchor="middle" fill="#a1a1aa" font-size="11.5">37 C.F.R. § 202.4(k) (Circular 58) requires identical first publication date and album unit</text>

  <!-- Sub-branch 2A: YES (Same Album, Same Date) -> Center Column -->
  <path d="M 640 256 L 640 310" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle r="4.5" fill="#38bdf8"><animateMotion dur="1.2s" repeatCount="indefinite" path="M640,256 L640,310"/></circle>
  <rect x="555" y="268" width="170" height="22" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
  <text x="640" y="283" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="700">YES: Same Album &amp; Date</text>

  <!-- Sub-branch 2B: NO (Different Years or Separate Singles) -> Right Column -->
  <path d="M 1060 256 L 1060 310" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <circle r="4.5" fill="#fbbf24"><animateMotion dur="1.2s" repeatCount="indefinite" path="M1060,256 L1060,310"/></circle>
  <rect x="955" y="268" width="210" height="22" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="1060" y="283" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700">NO: Different Dates or Years</text>

  <!-- ================================================= -->
  <!-- CARD 1: UNPUBLISHED GROUP ($85)                   -->
  <!-- ================================================= -->
  <rect x="32" y="224" width="380" height="390" rx="6" fill="#09090b" stroke="#22c55e" stroke-width="2.2"/>
  <rect x="48" y="240" width="348" height="34" rx="4" fill="#052e16"/>
  <text x="60" y="262" fill="#4ade80" font-size="14.5" font-weight="700">Option A: Register BEFORE Release (Best)</text>

  <text x="48" y="296" fill="#f4f4f5" font-size="13.5" font-weight="700">1. Group of Unpublished Works (Circular 55)</text>
  <text x="48" y="318" fill="#4ade80" font-size="15" font-weight="700" class="mono">$85 Online Filing Fee</text>
  <text x="48" y="340" fill="#e4e4e7" font-size="11.5">• Registers up to 10 unpublished works on 1 form</text>
  <text x="48" y="359" fill="#a1a1aa" font-size="11">• Must have the same author(s) and same claimant</text>
  <text x="48" y="378" fill="#a1a1aa" font-size="11">• Can include songs written in different years ONLY</text>
  <text x="48" y="395" fill="#86efac" font-size="11" font-weight="600">  if NONE of them have been published yet!</text>
  <text x="48" y="414" fill="#a1a1aa" font-size="11">• Cost per work (at 10 works): $8.50 per work</text>

  <line x1="48" y1="432" x2="396" y2="432" stroke="#27272a" stroke-width="1.5"/>

  <text x="48" y="456" fill="#f4f4f5" font-size="13.5" font-weight="700">2. Single Unpublished Song (Circular 4)</text>
  <text x="48" y="478" fill="#4ade80" font-size="14.5" font-weight="700" class="mono">$45 Single App (or $65 Standard)</text>
  <text x="48" y="500" fill="#e4e4e7" font-size="11.5">• Use $45 Single App when filing 1 song written</text>
  <text x="48" y="518" fill="#e4e4e7" font-size="11.5">  and recorded by 1 person (covers © + ℗ together)</text>
  <text x="48" y="537" fill="#a1a1aa" font-size="11">• Use $85 Group Unpublished as soon as you have</text>
  <text x="48" y="554" fill="#a1a1aa" font-size="11">  2 to 10 unreleased songs ready to register</text>

  <rect x="48" y="568" width="348" height="32" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
  <text x="222" y="588" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">Locks in Statutory Damages BEFORE Day 1 stream</text>

  <!-- ================================================= -->
  <!-- CARD 2: PUBLISHED ALBUM GROUP ($65 GRAM)          -->
  <!-- ================================================= -->
  <rect x="450" y="314" width="380" height="300" rx="6" fill="#09090b" stroke="#38bdf8" stroke-width="2.2"/>
  <rect x="466" y="330" width="348" height="34" rx="4" fill="#082f49"/>
  <text x="478" y="352" fill="#38bdf8" font-size="14.5" font-weight="700">Option B: Group Album of Music (GRAM)</text>

  <text x="466" y="386" fill="#38bdf8" font-size="15" font-weight="700" class="mono">$65 Online Filing Fee (Circular 58)</text>
  <text x="466" y="408" fill="#e4e4e7" font-size="11.5">• Registers 2 to 20 tracks published on the SAME album</text>
  <text x="466" y="427" fill="#bae6fd" font-size="11.5" font-weight="600">• Mandatory rule: Every track must share the exact</text>
  <text x="466" y="444" fill="#bae6fd" font-size="11.5" font-weight="600">  same First Publication Date and same Album Title</text>
  <text x="466" y="465" fill="#a1a1aa" font-size="11">• Can file one $65 GRAM for 2-20 Sound Recordings (℗)</text>
  <text x="466" y="482" fill="#a1a1aa" font-size="11">  and one $65 GRAM for 2-20 Musical Works (©)</text>
  <text x="466" y="501" fill="#fca5a5" font-size="11">• Note: Any single released BEFORE the album drop has</text>
  <text x="466" y="518" fill="#fca5a5" font-size="11">  an earlier publication date and must be listed separately</text>
  <text x="466" y="535" fill="#a1a1aa" font-size="11">  (or registered when first released as a single)</text>

  <rect x="466" y="568" width="348" height="32" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
  <text x="640" y="588" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="700">File within 3 months of release for Statutory Damages</text>

  <!-- ================================================= -->
  <!-- CARD 3: DIFFERENT DATES / DIFFERENT YEARS ($45/$65)-->
  <!-- ================================================= -->
  <rect x="868" y="314" width="380" height="300" rx="6" fill="#09090b" stroke="#f59e0b" stroke-width="2.2"/>
  <rect x="884" y="330" width="348" height="34" rx="4" fill="#451a03"/>
  <text x="896" y="352" fill="#fbbf24" font-size="14.5" font-weight="700">Option C: Separate Singles / Different Years</text>

  <text x="884" y="386" fill="#fbbf24" font-size="14" font-weight="700" class="mono">$45 (Single) or $65 (Standard) per Song</text>
  <text x="884" y="408" fill="#e4e4e7" font-size="11.5">• Required when songs were already released on</text>
  <text x="884" y="425" fill="#e4e4e7" font-size="11.5">  Spotify/Apple Music across different dates or years</text>
  <text x="884" y="446" fill="#fde68a" font-size="11.5" font-weight="600">• $45 Single Application eligibility (all 3 required):</text>
  <text x="884" y="464" fill="#a1a1aa" font-size="11">  1. One song (can cover both © and ℗ in one filing)</text>
  <text x="884" y="481" fill="#a1a1aa" font-size="11">  2. Created and performed by ONE sole individual</text>
  <text x="884" y="498" fill="#a1a1aa" font-size="11">  3. Sole owner (not work-for-hire, no co-writers)</text>
  <text x="884" y="519" fill="#e4e4e7" font-size="11">• $65 Standard Application: Used if 2+ co-writers,</text>
  <text x="884" y="536" fill="#e4e4e7" font-size="11">  featured guest performers, or label/LLC ownership</text>

  <rect x="884" y="568" width="348" height="32" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="1058" y="588" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700">10 past singles across different years = 10 x $45 ($450)</text>

  <!-- ================================================= -->
  <!-- BOTTOM LEGAL WARNING BAR (17 U.S.C. § 411(b))     -->
  <!-- ================================================= -->
  <rect x="32" y="636" width="1216" height="116" rx="6" fill="#09090b" stroke="#f87171" stroke-width="2"/>
  <rect x="48" y="652" width="220" height="24" rx="4" fill="#450a0a" stroke="#f87171" stroke-width="1"/>
  <text x="158" y="668" text-anchor="middle" fill="#fca5a5" font-size="11.5" font-weight="700" class="mono">17 U.S.C. § 411(b) WARNING</text>
  <text x="282" y="669" fill="#f87171" font-size="14" font-weight="700">Why You Must Never Falsify Publication Dates or Years to Force a Group Registration</text>
  <text x="48" y="694" fill="#e4e4e7" font-size="12">If a song is already live on Spotify from 2023 or 2024, its public release date and ISRC metadata are permanently timestamped in public DSP databases.</text>
  <text x="48" y="714" fill="#a1a1aa" font-size="11.5">Claiming already-published tracks are "unpublished" (or falsifying their publication year to bundle them into one $65/$85 group form) violates 17 U.S.C. § 411(b):</text>
  <text x="48" y="734" fill="#fca5a5" font-size="11.5" font-weight="600">In an infringement lawsuit, opposing counsel subpoenas the Register of Copyrights to invalidate the group registration certificate, stripping your right to sue.</text>
</svg>